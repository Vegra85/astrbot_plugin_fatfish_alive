name: astrbot_plugin_fatfish_alive
display_name: 大肥鱼 · 活人感
desc: 让机器人在聊天里像真人：连着发的几条等一等只回一次（攒一攒，「稍等 / 还没说完」先不回；最后一句尾巴含糊先问一下说完没有；私聊里对方还在输入就再等等）；群里没 @ 也能接上话、说上话后在线聊一阵、冷场试探、到点收尾，「好了 / 就这样 / 睡了」不接（群聊节奏）；花得越多回得越少（省 token，管理员可「火力全开」）；框架报错不发出去、只有 <think> 就补一句、可选去掉客服腔、群友手打的系统标记标成他打的字（兜底）。可选打字节奏（按字数慢慢发）和打字刹车（分段发到一半对方又说话了就不往下发）；对方撤回了、说了「算了」，还没发的那几句就不发了；群里只引用找它的那一条（发消息）。接话打分：没 @ 它的群消息按 8 条理由打分（借 Inner Thoughts 论文，规则算、不花 token），默认只记录、面板上看每次接不接和为什么，可以切成按分数决定。装了同类的接话 / 消息防抖插件，重叠的那几块自动让路（名单见 README）。一个面板看全部。
short_desc: 攒一攒 + 群聊节奏 + 省 token + 兜底 + 打字节奏 + 撤回就不发 + 接话打分，装了同类插件自动让路
